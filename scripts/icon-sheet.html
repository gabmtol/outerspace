<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OuterSpace icon candidates</title>
<style>
  body { margin: 0; font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: #ece8f2; color: #1c1c1e; }
  .sheet { display: grid; grid-template-columns: repeat(3, 1fr); width: 1500px; }
  .col { padding: 36px 28px 28px; text-align: center; }
  .col:nth-child(2) { background: #e2dcea; }
  h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 20px; color: #5b5866; }
  .big { width: 300px; height: 300px; display: block; margin: 0 auto 24px; }
  .row { display: flex; justify-content: center; align-items: end; gap: 22px; padding: 18px; border-radius: 16px; }
  .light { background: #f7f5fa; }
  .dark { background: #1b1a22; margin-top: 12px; }
  .row img { display: block; }
</style>
</head>
<body>
<div class="sheet">
  <div class="col">
    <h2>1 · Orb</h2>
    <p>Glass planet with a ring, like a glass Saturn</p>
    <img class="big" src="../assets/icon/variants/outerspace-orb.svg">
    <div class="row light"><img src="../assets/icon/variants/outerspace-orb.svg" width="64"><img src="../assets/icon/variants/outerspace-orb.svg" width="32"><img src="../assets/icon/variants/outerspace-orb.svg" width="16"></div>
    <div class="row dark"><img src="../assets/icon/variants/outerspace-orb.svg" width="64"><img src="../assets/icon/variants/outerspace-orb.svg" width="32"><img src="../assets/icon/variants/outerspace-orb.svg" width="16"></div>
  </div>
  <div class="col">
    <h2>2 · Eclipse</h2>
    <p>Tinted glass moon over a golden sun</p>
    <img class="big" src="../assets/icon/variants/outerspace-eclipse.svg">
    <div class="row light"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="64"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="32"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="16"></div>
    <div class="row dark"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="64"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="32"><img src="../assets/icon/variants/outerspace-eclipse.svg" width="16"></div>
  </div>
  <div class="col">
    <h2>3 · Spark</h2>
    <p>Four-point glass star (the agent) in orbit</p>
    <img class="big" src="../assets/icon/variants/outerspace-spark.svg">
    <div class="row light"><img src="../assets/icon/variants/outerspace-spark.svg" width="64"><img src="../assets/icon/variants/outerspace-spark.svg" width="32"><img src="../assets/icon/variants/outerspace-spark.svg" width="16"></div>
    <div class="row dark"><img src="../assets/icon/variants/outerspace-spark.svg" width="64"><img src="../assets/icon/variants/outerspace-spark.svg" width="32"><img src="../assets/icon/variants/outerspace-spark.svg" width="16"></div>
  </div>
</div>
</body>
</html>
