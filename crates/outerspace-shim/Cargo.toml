[package]
name = "outerspace-shim"
description = "outerspace-mcp.exe: the stdio MCP server clients launch, bridged to the OuterSpace app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "outerspace-mcp"
path = "src/main.rs"

[dependencies]
outerspace-core.workspace = true
serde_json.workspace = true
ureq = { version = "3.5.0", default-features = false }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
