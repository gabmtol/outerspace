[workspace]
resolver = "3"
members = ["crates/outerspace-core", "crates/outerspace-mcp", "crates/outerspace-shim", "app/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"

# Full debug info for every crate took the build directory past 11 GB; line tables are enough for
# backtraces, and dependencies need none.
[profile.dev]
debug = "line-tables-only"

# Image scaling/encoding is far too slow unoptimized; build dependencies optimized even in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace.dependencies]
outerspace-core = { path = "crates/outerspace-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
windows = "0.62.2"
